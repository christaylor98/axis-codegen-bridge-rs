[package]
name = "axis-codegen-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "axis_codegen_bridge"
path = "src/lib.rs"

[[bin]]
name = "axis-codegen-bridge"
path = "src/main.rs"

# F24 slice 3 — the stream renderer process (reads frames from a socket and draws them natively; needs the window renderer)
[[bin]]
name = "axgfx_render"
path = "src/bin/axgfx_render.rs"
required-features = ["gfx-wgpu"]

[features]
default = []
# AXVERITY_HOTPATH_UNBLOCK_V1 — per-allocation counting (runtime::allocprobe).
# OFF by default: as an unconditional #[global_allocator] it was measured as the
# dominant serialization point in production pg_server (see src/runtime/
# allocprobe.rs). Enable ONLY for a measurement turn:
#   cargo build --release --features allocprobe
allocprobe = []
# F24 slice 1 — the native window renderer for the frame command stream (runtime::gfx_wgpu): wgpu + winit.
# OFF by default: headless and default builds do not pull it in; gfx_open then returns false.
#   cargo build --release --features gfx-wgpu --target-dir target-gfx
gfx-wgpu = ["dep:wgpu", "dep:winit", "dep:pollster", "dep:bytemuck"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
rust_decimal = "1"
libc = "0.2"
# AXVERITY_POSTGRES_STORE_SWAP_V1 — postgres-backed durable store for the
# graphcore store layer (pg_store.rs). Synchronous client; postgres's WAL +
# group commit own durability, so the M1 store layer stops issuing fsyncs.
postgres = "0.19"
cudarc = { version = "0.19", default-features = false, features = ["driver", "dynamic-loading", "std", "cuda-12040", "nvrtc"] }
# F24 slice 1 (optional, feature gfx-wgpu): the window and the GPU surface for the frame command stream.
wgpu = { version = "0.19", optional = true }
winit = { version = "0.29", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1", optional = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3.0"

# loom is only pulled in / compiled under `--cfg loom` (never in normal builds
# or the standard test run). Used by tests/loom_arena.rs to model the Hot Mem
# arena pin/fence/publish/scan/free protocol exhaustively under the C11 memory
# model. Run: RUSTFLAGS="--cfg loom" cargo test --test loom_arena --release
[target.'cfg(loom)'.dependencies]
loom = "0.7"
